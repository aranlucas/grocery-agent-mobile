name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm, Node.js, and dependencies
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          require-lockfile: true

      # Uniwind's Metro FileStore uses os.tmpdir()/metro-cache. Keep its native
      # content-addressed invalidation and skip-cache handling for generated CSS.
      - name: Restore Metro transform cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/metro-cache
          key: ${{ runner.os }}-${{ runner.arch }}-metro-${{ hashFiles('pnpm-lock.yaml', 'metro.config.js', 'babel.config.js', 'app.config.js', '.node-version') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-metro-${{ hashFiles('pnpm-lock.yaml', 'metro.config.js', 'babel.config.js', 'app.config.js', '.node-version') }}-

      - parallel:
          - name: Lint
            run: pnpm lint && pnpm fmt:check

          - name: Typecheck
            run: pnpm typecheck

          - name: Test
            run: pnpm test

          - name: Check Expo dependency versions
            run: pnpm exec expo install --check

          - name: Validate Android and iOS exports
            run: pnpm build
