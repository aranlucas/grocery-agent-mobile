name: Reliability regressions

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reliability-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e
        with:
          cache: true
          require-lockfile: true
      - name: Prove the new assertions reject the defective baseline
        shell: bash
        run: |
          git show 4e6f4773a1f4d8a7b9ce4f3672d96cbca571dfd2:src/lib/grocery-state.ts > src/lib/grocery-state.ts
          git show 4e6f4773a1f4d8a7b9ce4f3672d96cbca571dfd2:src/components/grocery-chat.tsx > src/components/grocery-chat.tsx
          set +e
          pnpm exec vitest run test/cart-boundary.test.ts test/chat-composer.test.ts --reporter=json --outputFile=baseline.json
          result=$?
          set -e
          test "$result" -eq 1
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync('baseline.json', 'utf8'));
          if (report.numFailedTests !== 7 || report.numPassedTests !== 2) {
            throw new Error('Expected five malformed-price failures and two composer failures; inspect baseline report.');
          }
          NODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: defective-baseline
          path: baseline.json

  native:
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        revision: [baseline, fixed]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "1"
      GROCERY_E2E: "1"
      EXPO_NO_DOTENV: "1"
      EXPO_NO_TELEMETRY: "1"
      SENTRY_DISABLE_AUTO_UPLOAD: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e
        with:
          cache: true
          require-lockfile: true
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: 17
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Restore defective saved-list for negative control
        if: matrix.revision == 'baseline'
        run: |
          git fetch origin 4e6f4773a1f4d8a7b9ce4f3672d96cbca571dfd2
          git show 4e6f4773a1f4d8a7b9ce4f3672d96cbca571dfd2:src/app/saved-list.tsx > src/app/saved-list.tsx
      - name: Generate Android project
        run: pnpm exec expo prebuild --platform android --no-install
      - name: Build isolated fixture APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon
      - name: Run deterministic native editor journey
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb reverse tcp:8855 tcp:8855
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            set +e; pnpm exec e2e run --target android; result=$?; if [ '${{ matrix.revision }}' = baseline ]; then test "$result" -eq 1 && grep -q 'toBeDisabled' .e2e/junit.xml; else exit "$result"; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: native-editor-evidence-${{ matrix.revision }}
          path: .e2e
          if-no-files-found: warn
          retention-days: 7
