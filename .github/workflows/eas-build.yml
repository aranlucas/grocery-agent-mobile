# Pilot adaptation of @react-native-feel/deploy@0.3.0's simulator template.
# Original template SHA-256: 69bf6bc354a50fc9a068cd1089bad7554761b5c7baae41c37c6f9ee9b436b07d
# Keep this filename and dispatch contract for rnd. Only unsigned iOS is allowed.
name: Feel iOS Simulator Pilot

run-name: >-
  ios feel-simulator build
  [eas:dispatch_id=${{ inputs.dispatch_id || github.run_id }};platform=ios;profile=feel-simulator;distribution=internal;simulator=true]

on:
  pull_request:
    paths:
      - .github/workflows/eas-build.yml
      - .node-version
      - scripts/feel-simulator*
      - docs/feel-deploy-pilot.md
      - app.config.js
      - app.json
      - package.json
      - pnpm-lock.yaml
      - eas.json
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: rnd correlation ID
        required: true
      platform:
        description: Only ios is supported
        required: true
        default: ios
      profile:
        description: Only feel-simulator is supported
        required: true
        default: feel-simulator
      runner:
        description: Only the standard macos-26 runner is supported
        required: true
        default: macos-26
      config_json:
        description: Resolved rnd simulator build plan; checked before building
        required: true

permissions:
  contents: read

concurrency:
  group: feel-simulator-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.head_ref == 'pilot/feel-deploy-ios-simulator') ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/pilot/feel-deploy-ios-simulator')
    runs-on: macos-26
    timeout-minutes: 90
    env:
      CI: "1"
      DO_NOT_TRACK: "1"
      RND_TELEMETRY_DISABLED: "1"
      EXPO_NO_DOTENV: "1"
      EXPO_NO_TELEMETRY: "1"
      FEEL_DISPATCH_PLAN: ${{ inputs.config_json }}
      FEEL_DISPATCH_PLATFORM: ${{ inputs.platform }}
      FEEL_DISPATCH_PROFILE: ${{ inputs.profile }}
      FEEL_DISPATCH_RUNNER: ${{ inputs.runner }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          require-lockfile: true
      - name: Inspect and resolve the pinned Deploy profile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/feel-pilot
          npm pack @react-native-feel/deploy@0.3.0 --ignore-scripts --pack-destination "$RUNNER_TEMP"
          python3 - "$RUNNER_TEMP/react-native-feel-deploy-0.3.0.tgz" <<'PY'
          import base64, hashlib, sys
          expected = 'BKb5rzPVnUEO7wPxoL6oT3COW7wku0m8YbXrRYLVGd/obSyCBo4hk0dbSsNh9NwTCptNC87dwIFBZoj4fIe9bw=='
          actual = base64.b64encode(hashlib.sha512(open(sys.argv[1], 'rb').read()).digest()).decode()
          assert actual == expected, 'Deploy tarball integrity mismatch'
          PY
          npm install --prefix "$RUNNER_TEMP/feel-deploy" --ignore-scripts --no-audit --no-fund \
            "$RUNNER_TEMP/react-native-feel-deploy-0.3.0.tgz"
          node "$RUNNER_TEMP/feel-deploy/node_modules/@react-native-feel/deploy/dist/bin/rnd.js" \
            config --platform ios --profile feel-simulator --json > dist/feel-pilot/resolved-profile.json
          node scripts/feel-simulator.mjs check
      - name: Verify the existing app checks
        run: pnpm validate
      - name: Record Xcode version
        run: xcodebuild -version
      - name: Build and verify the unsigned simulator app
        shell: bash
        run: |
          set -euo pipefail
          pnpm build:feel:simulator:ios 2>&1 | tee dist/feel-pilot/build.log
      - name: Upload simulator app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: application-archive
          path: dist/feel-pilot/GroceryAgentFeelPilot-simulator.tar.gz
          if-no-files-found: error
          retention-days: 7
      - name: Upload native build diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xcode-logs
          path: dist/feel-pilot/build.log
          if-no-files-found: ignore
          retention-days: 7
